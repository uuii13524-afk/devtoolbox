<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dev ToolBox</title>

  <style>
    :root {
      --bg: #f7f7f7;
      --text: #111;
      --card: #fff;
      --shadow: rgba(0,0,0,0.1);
    }

    body.dark {
      --bg: #121212;
      --text: #f1f1f1;
      --card: #1e1e1e;
      --shadow: rgba(0,0,0,0.4);
    }

    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: var(--bg);
      color: var(--text);
      transition: 0.3s;
    }

    h2 {
      margin-top: 30px;
    }

    #search {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      margin-bottom: 15px;
    }

    button {
      padding: 8px 12px;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card);
      padding: 15px;
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      box-shadow: 0 2px 6px var(--shadow);
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<h1>Dev ToolBox</h1>

<button onclick="toggleTheme()">Toggle Dark Mode</button>

<br>

<input
  id="search"
  placeholder="Search tools..."
  oninput="filterTools()"
/>

<!-- TEXT -->
<h2>Text Tools</h2>
<div class="grid">

  <a class="card" href="/tools/json-formatter.html">
    JSON Formatter
  </a>

  <a class="card" href="/tools/base64.html">
    Base64 Encode / Decode
  </a>

  <a class="card" href="/tools/url-encoder.html">
    URL Encoder / Decoder
  </a>
  
  <a class="card" href="/tools/jwt-decoder.html">
    JWT Decoder
  </a>
  
  <a class="card" href="/tools/timestamp-converter.html">
    Timestamp Converter
  </a>

  <a class="card" href="/tools/hash-generator.html">
    Hash Generator (SHA-256)
  </a>
  
</div>

<!-- DEV -->
<h2>Dev Tools</h2>
<div class="grid">

  <a class="card" href="/tools/uuid-generator.html">
    UUID Generator
  </a>

  <a class="card" href="/tools/regex-tester.html">
    Regex Tester
  </a>

</div>

<script>
function filterTools() {

  const input = document.getElementById('search').value.toLowerCase();
  const cards = document.querySelectorAll('.card');

  cards.forEach(card => {

    const text = card.textContent.toLowerCase();

    card.style.display =
      text.includes(input) ? "block" : "none";

  });
}

function toggleTheme() {

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "theme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
}

(function initTheme() {
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
  }
})();
</script>

</body>
</html>
