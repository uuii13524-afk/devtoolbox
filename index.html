<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dev ToolBox</title>

  <link rel="stylesheet" href="/assets/style.css">

  <style>
    body {
      font-family: Arial;
      margin: 40px;
    }

    h2 {
      margin-top: 30px;
    }

    #search {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .card {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      text-decoration: none;
      color: black;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

<h1>Dev ToolBox</h1>

<input
  id="search"
  placeholder="Search tools..."
  oninput="filterTools()"
/>

<!-- 🔤 TEXT -->
<h2>Text Tools</h2>
<div class="grid category">

  <a class="card" href="/tools/json-formatter.html">JSON Formatter</a>
  <a class="card" href="/tools/base64.html">Base64 Encode / Decode</a>
  <a class="card" href="/tools/url-encoder.html">URL Encoder</a>

</div>

<!-- 🔧 DEV -->
<h2>Dev Tools</h2>
<div class="grid category">

  <a class="card" href="/tools/uuid-generator.html">UUID Generator</a>
  <a class="card" href="/tools/regex-tester.html">Regex Tester</a>
  <a class="card" href="/tools/jwt-decoder.html">JWT Decoder</a>
  <a class="card" href="/tools/timestamp-converter.html">Timestamp Converter</a>

</div>

<!-- 🔐 SECURITY -->
<h2>Security Tools</h2>
<div class="grid category">

  <a class="card" href="/tools/hash-generator.html">Hash Generator</a>

</div>

<script>
function filterTools() {

  const input = document.getElementById('search').value.toLowerCase();
  const cards = document.querySelectorAll('.card');

  cards.forEach(card => {

    const text = card.textContent.toLowerCase();

    card.style.display =
      text.includes(input) ? "block" : "none";
  });
}
</script>

</body>
</html>
