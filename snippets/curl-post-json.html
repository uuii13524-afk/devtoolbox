<!DOCTYPE html>
<html>
<head>
  <title>cURL POST JSON Example</title>
</head>
<body>

<h1>cURL POST JSON Example</h1>

<p>
Simple example for sending JSON with cURL.
</p>

<h2>Example</h2>

<pre><code>
curl -X POST https://example.com/api \
  -H "Content-Type: application/json" \
  -d '{"name":"john"}'
</code></pre>

</body>
</html>
