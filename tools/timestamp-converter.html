<!DOCTYPE html>
<html>
<head>
  <title>Timestamp Converter</title>

  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/common.js"></script>
</head>
<body>

<h1>Timestamp Converter</h1>

<input id="input" placeholder="timestamp or date">

<br><br>

<button onclick="toDate()">To Date</button>
<button onclick="toTimestamp()">To Timestamp</button>
<button onclick="copyText('output')">Copy</button>

<pre id="output"></pre>

<script>
function toDate() {
  const ts = Number(document.getElementById('input').value);

  document.getElementById('output').textContent =
    isNaN(ts) ? "Invalid" : new Date(ts * 1000).toISOString();
}

function toTimestamp() {
  const date = Date.parse(document.getElementById('input').value);

  document.getElementById('output').textContent =
    isNaN(date) ? "Invalid" : Math.floor(date / 1000);
}
</script>

</body>
</html>
