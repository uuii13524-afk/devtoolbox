<!DOCTYPE html>
<html>
<head>
  <title>Hash Generator</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<h1>Hash Generator (SHA-256)</h1>

<p>Generate SHA-256 hash from text.</p>

<textarea id="input" rows="5" cols="50" placeholder="Enter text"></textarea>

<br><br>

<button onclick="generateHash()">Generate</button>
<button onclick="copyText('output')">Copy</button>

<h3>Result</h3>
<pre id="output"></pre>

<script>
async function generateHash() {

  const text = document.getElementById('input').value;

  const encoder = new TextEncoder();
  const data = encoder.encode(text);

  const hashBuffer = await crypto.subtle.digest('SHA-256', data);

  const hashArray = Array.from(new Uint8Array(hashBuffer));

  const hashHex = hashArray
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');

  document.getElementById('output').textContent = hashHex;
}

function copyText(id) {
  const text = document.getElementById(id).textContent;

  if (!text) return alert("Nothing to copy");

  navigator.clipboard.writeText(text)
    .then(() => alert("Copied!"))
    .catch(() => alert("Copy failed"));
}
</script>

</body>
</html>
